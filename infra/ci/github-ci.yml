name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: autoflow
          POSTGRES_DB: autoflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-postgres.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://autoflow:autoflow@localhost:5432/autoflow
      - name: Migrations à jour
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://autoflow:autoflow@localhost:5432/autoflow
        run: |
          psql postgresql://autoflow:autoflow@localhost:5432/autoflow -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check
      - name: Audit des dépendances
        run: pip-audit -r requirements-postgres.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
