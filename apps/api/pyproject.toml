[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "ASYNC", "I"]
ignore = [
    "B008",  # Depends() en argument par défaut : idiome FastAPI
    "S101",  # assert dans les tests
    "E501",  # longueur gérée par le formateur
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
